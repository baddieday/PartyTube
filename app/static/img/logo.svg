<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">PartyTube Logo</title>
  <desc id="desc">Premium rot-schwarze PartyTube Wortmarke mit Play-Symbol</desc>
  <defs>
    <linearGradient id="markGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0444d"/>
      <stop offset="0.48" stop-color="#d71d2a"/>
      <stop offset="1" stop-color="#820d15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#d71d2a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#d71d2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" color-interpolation-filters="sRGB" x="-20%" y="-35%" width="140%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#d71d2a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="920" height="260" fill="none"/>
  <ellipse cx="142" cy="130" rx="138" ry="116" fill="url(#glow)"/>

  <g filter="url(#softShadow)">
    <rect x="42" y="48" width="196" height="164" rx="58" fill="#070707" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
    <rect x="58" y="64" width="164" height="132" rx="44" fill="url(#markGradient)"/>
    <path d="M122 94 L178 130 L122 166 Z" fill="#fff"/>
    <path d="M64 78 C86 54 118 42 154 42" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
    <path d="M210 180 C190 204 159 218 118 217" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.22"/>
  </g>

  <g font-family="Aptos Display, Segoe UI, Arial, sans-serif" font-weight="900" letter-spacing="-8">
    <text x="270" y="128" font-size="94" fill="#ffffff">PARTY</text>
    <text x="270" y="205" font-size="94" fill="url(#markGradient)">TUBE</text>
  </g>
  <g font-family="Aptos, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="5">
    <text x="278" y="55" font-size="18" fill="#b6adb1">LAN MUSIC CONTROL</text>
  </g>
  <path d="M274 222 H824" stroke="#d71d2a" stroke-width="5" stroke-linecap="round" opacity="0.82"/>
</svg>
