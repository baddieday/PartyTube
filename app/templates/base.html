<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="PartyTube ist die lokale Party-Jukebox für YouTube-Queue, Voting, TV-Screen und QR-Join im Heimnetz.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PartyTube">
    <title>{{ settings.app_name }} | {{ settings.party_name }}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="icon" href="/static/img/icon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-page="{{ page }}">
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>
    <header class="shell-header">
        <a class="brand" href="/">
            <img class="brand-logo" src="/static/img/logo.svg" alt="PartyTube">
            <div class="brand-copy">
                <strong>{{ settings.party_name }}</strong>
                <span>Code {{ settings.party_code }}</span>
            </div>
        </a>
        <nav class="top-nav">
            <a class="nav-link-primary" href="/start" {% if page == "start" %}aria-current="page"{% endif %}>Start</a>
            <a class="nav-link-primary" href="/" {% if page == "guest" %}aria-current="page"{% endif %}>Queue</a>
            <a class="nav-link-primary" href="/player" {% if page == "player" %}aria-current="page"{% endif %}>TV</a>
            <a class="nav-link-primary" href="/party-screen" {% if page == "party-screen" %}aria-current="page"{% endif %}>Screen</a>
            <a class="nav-link-primary" href="/admin" {% if page == "admin" %}aria-current="page"{% endif %}>Host</a>
            <a class="nav-link-secondary" href="/history" {% if page == "history" %}aria-current="page"{% endif %}>Verlauf</a>
            <a class="nav-link-secondary" href="/audio" target="_blank" rel="noreferrer">Audio</a>
            <a class="nav-link-secondary" href="/qr" {% if page == "qr" %}aria-current="page"{% endif %}>QR</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <aside class="ambient-dock hidden" id="ambient-audio-dock" aria-live="polite">
        <div class="ambient-copy">
            <p class="eyebrow">Audio-Fenster</p>
            <strong id="ambient-song-title">Audio-Fenster bereit</strong>
            <p id="ambient-audio-status">Einmal öffnen. Ton bleibt stabil.</p>
        </div>
        <div class="ambient-actions">
            <button class="primary-button" id="ambient-audio-toggle" type="button">Audio</button>
            <a class="ghost-button" href="/player" target="_blank" rel="noreferrer">TV</a>
        </div>
    </aside>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
    <script id="app-config" type="application/json">{{ app_config | tojson }}</script>
    <script src="/static/js/shared.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
