<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">PartyTube Logo</title>
  <desc id="desc">Eigene PartyTube Wortmarke mit Konfetti und Play-Signet</desc>
  <defs>
    <linearGradient id="tubePink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff4ca3"/>
      <stop offset="1" stop-color="#ff1478"/>
    </linearGradient>
    <linearGradient id="tubeBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#35d2ff"/>
      <stop offset="1" stop-color="#0098f7"/>
    </linearGradient>
    <linearGradient id="tubeGold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe267"/>
      <stop offset="1" stop-color="#ffbf16"/>
    </linearGradient>
    <filter id="tubeShadow" color-interpolation-filters="sRGB" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g transform="translate(42 34)" filter="url(#tubeShadow)">
    <path
      d="M167 34 H710 C775 34 840 36 890 44 C944 52 985 68 1009 103 C1028 131 1032 165 1022 195 C1011 227 985 256 945 275 C907 293 858 302 798 304 H167 C112 304 77 294 59 274 C41 254 32 220 30 170 C28 123 33 89 49 68 C66 46 105 34 167 34 Z"
      fill="#050505"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linejoin="round"
    />
    <path
      d="M826 74 C889 72 934 81 962 100 C989 119 1000 148 996 184 C992 222 974 248 942 264 C911 280 867 287 811 285"
      fill="none"
      stroke="#ffffff"
      stroke-width="15"
      stroke-linecap="round"
      opacity="0.96"
    />
    <circle cx="863" cy="171" r="72" fill="url(#tubePink)"/>
    <circle cx="863" cy="171" r="46" fill="#050505"/>
    <path d="M849 142 L892 171 L849 200 Z" fill="#ffffff"/>

    <g font-family="Aptos Display, Segoe UI, Arial, sans-serif" font-weight="900" letter-spacing="-7">
      <text x="122" y="174" font-size="138" fill="#ffffff">PARTY</text>
      <text x="182" y="272" font-size="138" fill="url(#tubePink)">TUBE</text>
    </g>

    <path d="M27 146 L-4 127" fill="none" stroke="url(#tubeBlue)" stroke-width="24" stroke-linecap="round"/>
    <path d="M101 78 L45 16" fill="none" stroke="url(#tubePink)" stroke-width="31" stroke-linecap="round"/>
    <path d="M186 54 L174 112" fill="none" stroke="url(#tubeGold)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="149" cy="25" r="14" fill="url(#tubePink)"/>
    <path d="M296 24 L314 56 L349 62 L322 85 L329 122 L296 103 L264 122 L270 85 L243 62 L278 56 Z" fill="url(#tubeGold)"/>
    <path d="M466 6 L440 93" fill="none" stroke="url(#tubeBlue)" stroke-width="28" stroke-linecap="round"/>
    <path d="M611 52 L565 95" fill="none" stroke="url(#tubePink)" stroke-width="25" stroke-linecap="round"/>
  </g>
</svg>
